name: MEXE CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-backend:
    needs:
      - backend-tests
      - frontend-build

    uses: docker/github-builder/.github/workflows/build.yml@v1

    permissions:
      contents: read
      packages: write
      id-token: write

    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      context: ./backend
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/rafakka/mexe-backend
      meta-tags: |
        type=raw,value=${{ github.sha }}
      cache: true
      cache-scope: mexe-backend

    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  docker-frontend:
    needs:
      - backend-tests
      - frontend-build

    uses: docker/github-builder/.github/workflows/build.yml@v1

    permissions:
      contents: read
      packages: write
      id-token: write

    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      context: ./frontend
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/rafakka/mexe-frontend
      meta-tags: |
        type=raw,value=${{ github.sha }}
      cache: true
      cache-scope: mexe-frontend

    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs:
      - docker-backend
      - docker-frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set MEXE_VERSION
        run: echo "MEXE_VERSION=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Show deployment version
        run: echo "Deploying MEXE version $MEXE_VERSION"
