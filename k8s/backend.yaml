apiVersion: apps/v1
kind: Deployment
metadata:
  name: mexe-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mexe-backend
  template:
    metadata:
      labels:
        app: mexe-backend
    spec:
      containers:
        - name: backend
          image: mexe-backend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: DEPENDENCY_EXPORTER_URL
              value: "http://mexe-dependency-exporter:8000"

            - name: DEPENDENCY_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mexe-dependency-refresh
                  key: DEPENDENCY_REFRESH_TOKEN
                  optional: true

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

---

apiVersion: v1
kind: Service
metadata:
  name: mexe-backend
spec:
  type: NodePort
  selector:
    app: mexe-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 32717
