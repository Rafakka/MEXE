apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: default
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "mexe_pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "service_name"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.mexe_pods.output
      forward_to = [loki.write.test.receiver]
    }

    loki.write "test" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }

---
apiVersion: v1
kind: Pod
metadata:
  name: alloy
  namespace: default
spec:
  serviceAccountName: alloy

  containers:
    - name: alloy
      image: grafana/alloy:v1.19.1

      args:
        - run
        - /etc/alloy/config.alloy

      volumeMounts:
        - name: config
          mountPath: /etc/alloy

  volumes:
    - name: config
      configMap:
        name: alloy-config
