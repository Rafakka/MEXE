
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "mexe"
        static_configs:
          - targets:
              - "mexe-backend:8000"

      - job_name: "mexe-security"
        static_configs:
          - targets:
              - "security-exporter:8000"

      - job_name: "mexe-dependency"
        static_configs:
          - targets:
            - "mexe-dependency-exporter:8000"
