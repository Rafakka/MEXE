
apiVersion: v1
kind: Pod
metadata:
  name: grafana-restore
spec:
  restartPolicy: Never
  containers:
    - name: restore
      image: alpine:3.22
      command:
        - sh
        - -c
        - sleep 36000
      volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
  volumes:
    - name: grafana-data
      persistentVolumeClaim:
        claimName: grafana-data

