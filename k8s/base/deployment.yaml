
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mexe-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mexe-backend
  template:
    metadata:
      labels:
        app: mexe-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/rafakka/mexe-backend:latest
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "768Mi"

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

