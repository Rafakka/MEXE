apiVersion: apps/v1
kind: Deployment
metadata:
  name: mexe-dependency-exporter
spec:
  replicas: 1

  selector:
    matchLabels:
      app: mexe-dependency-exporter

  template:
    metadata:
      labels:
        app: mexe-dependency-exporter

    spec:
      containers:
        - name: dependency-exporter
          image: mexe-dependency-exporter:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: GITLAB_URL
              value: "https://gitlab.com"

            - name: GITLAB_PROJECT
              value: "logos-group/mexe"

            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mexe-dependency-exporter
                  key: GITLAB_TOKEN

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: mexe-dependency-exporter
spec:
  selector:
    app: mexe-dependency-exporter

  ports:
    - port: 8000
      targetPort: 8000

  type: ClusterIP
