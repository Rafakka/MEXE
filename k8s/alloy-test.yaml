apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy-test
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-test
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-test
subjects:
  - kind: ServiceAccount
    name: alloy-test
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-test

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-test-config
  namespace: default
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.kubernetes.pods.targets
      forward_to = [loki.write.test.receiver]
    }

    loki.write "test" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }

---
apiVersion: v1
kind: Pod
metadata:
  name: alloy-test
  namespace: default
spec:
  serviceAccountName: alloy-test

  containers:
    - name: alloy
      image: grafana/alloy:v1.19.1

      args:
        - run
        - /etc/alloy/config.alloy

      volumeMounts:
        - name: config
          mountPath: /etc/alloy

  volumes:
    - name: config
      configMap:
        name: alloy-test-config
