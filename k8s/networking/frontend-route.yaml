apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mexe-frontend-route
  namespace: default
spec:
  parentRefs:
    - name: mexe-gateway
  hostnames:
    - mexe.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mexe-frontend
          port: 80
