global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "mexe"
    static_configs:
      - targets:
          - backend:8000

  - job_name: "mexe-dependency-exporter"
    scrape_interval: 60s
    static_configs:
      - targets:
          - "dependency-exporter:8000"

  - job_name: "mexe-security"
    static_configs:
      - targets:
          - "security-exporter:8000"
