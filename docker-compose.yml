
services:

  frontend:
    build:
      context: ./frontend
    container_name: mexe-frontend
    ports:
      - "8080:80"
    networks:
      - mexe
      - kind

  grafana:
    image: grafana/grafana:13.2.0
    container_name: mexe-grafana
    ports:
      - "3000:3000"
    environment:
      GITLAB_TOKEN: ${GITLAB_TOKEN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - mexe
      - kind

  dependency-exporter:
    build:
      context: ./dependency-exporter
    container_name: mexe-dependency-exporter
    environment:
      GITLAB_URL: https://gitlab.com
      GITLAB_PROJECT: logos-group/mexe
      GITLAB_TOKEN: ${GITLAB_TOKEN:?GITLAB_TOKEN must be set}
    expose:
      - "8000"
    networks:
      - mexe

volumes:
  grafana-data:

networks:
  mexe:
    driver: bridge
  kind:
    external: true
    name: kind
