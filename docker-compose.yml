
services:

  frontend:
    build:
      context: ./frontend
    container_name: mexe-frontend
    ports:
      - "8080:80"
    networks:
      - mexe
      - kind
  alloy:
    image: grafana/alloy:v1.19.1
    container_name: mexe-alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "run"
      - "/etc/alloy/config.alloy"
    networks:
      - mexe
      - kind

  grafana:
    image: grafana/grafana:13.2.0
    container_name: mexe-grafana
    ports:
      - "3000:3000"
    environment:
      GITLAB_TOKEN: ${GITLAB_TOKEN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - mexe
      - kind

  dependency-exporter:
    build:
      context: ./dependency-exporter
    container_name: mexe-dependency-exporter
    environment:
      GITLAB_URL: https://gitlab.com
      GITLAB_PROJECT: logos-group/mexe
      GITLAB_TOKEN: ${GITLAB_TOKEN:?GITLAB_TOKEN must be set}
    expose:
      - "8000"
    networks:
      - mexe

  security-exporter:
    build:
      context: ./security/exporter
    container_name: mexe-security-exporter
    volumes:
      - ./security/results:/results:ro
    expose:
      - "9000"
    networks:
      - mexe

volumes:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  mexe:
    driver: bridge
  kind:
    external: true
    name: kind
