apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://desktop-control-plane:31103
    isDefault: true
    editable: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://desktop-control-plane:32068
    editable: true

  - name: GitLab
    uid: gitlab
    type: grafana-gitlab-datasource
    access: proxy
    url: https://gitlab.com
    editable: true
    secureJsonData:
      accessToken: $GITLAB_TOKEN
