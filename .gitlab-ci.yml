workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - when: never

stages:
  - test
  - build
  - publish
  - deploy

backend-tests:
  stage: test
  image: python:3.14

  before_script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt

  script:
    - python -m pytest

frontend-build:
  stage: test
  image: node:22

  before_script:
    - cd frontend
    - npm ci

  script:
    - npm run build

docker-backend:
  stage: build
  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker info
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name mexe-builder

  script:
    - docker buildx build --platform linux/amd64,linux/arm64 --tag mexe-backend:test --push=false ./backend

docker-frontend:
  stage: build
  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker info
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name mexe-builder

  script:
    - docker buildx build --platform linux/amd64,linux/arm64 --tag mexe-frontend:test --push=false ./frontend

publish-images:
  stage: publish
  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker info
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name mexe-builder
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

  script:
    - docker buildx build --platform linux/amd64,linux/arm64 --tag ghcr.io/rafakka/mexe-backend:$CI_COMMIT_SHA --push ./backend
    - docker buildx build --platform linux/amd64,linux/arm64 --tag ghcr.io/rafakka/mexe-frontend:$CI_COMMIT_SHA --push ./frontend

deploy:
  stage: deploy

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com

  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]

  script:
    - echo "Starting MEXE deployment"

    - |
      CREDS=$(aws sts assume-role-with-web-identity \
        --role-arn "arn:aws:iam::719514706307:role/MEXE-SSM-Deploy" \
        --role-session-name "gitlab-mexe-deploy" \
        --web-identity-token "$GITLAB_OIDC_TOKEN" \
        --duration-seconds 900 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)

      export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | awk '{print $1}')
      export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | awk '{print $2}')
      export AWS_SESSION_TOKEN=$(echo "$CREDS" | awk '{print $3}')

    - aws sts get-caller-identity

    - |
      COMMAND_ID=$(aws ssm send-command \
        --instance-ids "i-0fb696d4212f059e7" \
        --document-name "AWS-RunShellScript" \
        --parameters 'commands=[
          "set -e",
          "cd /home/ubuntu/mexe",
          "cp .env .env.previous",
          "echo \"Previous version saved:\"",
          "cat .env",
          "sed -i \"s/^MEXE_VERSION=.*/MEXE_VERSION='$CI_COMMIT_SHA'/\" .env",
          "echo \"Deploying MEXE_VERSION=$CI_COMMIT_SHA\"",

          "DEPLOY_OK=1",
          "docker compose -f docker-compose.prod.yml pull || DEPLOY_OK=0",
          "docker compose -f docker-compose.prod.yml up -d || DEPLOY_OK=0",
          "docker compose -f docker-compose.prod.yml ps",

          "if [ \"$DEPLOY_OK\" = \"1\" ]; then echo \"Waiting for MEXE health check...\"; HEALTHY=0; for i in $(seq 1 30); do if curl -fsS http://localhost/api/health; then HEALTHY=1; break; fi; echo \"Health check failed. Attempt $i/30\"; sleep 2; done; if [ \"$HEALTHY\" != \"1\" ]; then DEPLOY_OK=0; fi; fi",

          "if [ \"$DEPLOY_OK\" = \"1\" ]; then echo \"=== MEXE DEPLOY SUCCESSFUL ===\"; exit 0; fi",

          "echo \"=== NEW VERSION FAILED ===\"",
          "echo \"Rolling back to previous version...\"",
          "cp .env.previous .env",
          "echo \"Rollback version:\"",
          "cat .env",

          "ROLLBACK_OK=1",
          "docker compose -f docker-compose.prod.yml pull || ROLLBACK_OK=0",
          "docker compose -f docker-compose.prod.yml up -d || ROLLBACK_OK=0",
          "docker compose -f docker-compose.prod.yml ps",

          "if [ \"$ROLLBACK_OK\" = \"1\" ]; then echo \"Waiting for rollback health check...\"; HEALTHY=0; for i in $(seq 1 30); do if curl -fsS http://localhost/api/health; then HEALTHY=1; break; fi; echo \"Rollback health check failed. Attempt $i/30\"; sleep 2; done; if [ \"$HEALTHY\" != \"1\" ]; then ROLLBACK_OK=0; fi; fi",

          "if [ \"$ROLLBACK_OK\" = \"1\" ]; then echo \"=== ROLLBACK SUCCESSFUL ===\"; exit 1; fi",

          "echo \"=== ROLLBACK FAILED ===\"",
          "exit 2"
        ]' \
        --query 'Command.CommandId' \
        --output text \
        --region "$AWS_DEFAULT_REGION")
      echo "SSM Command ID: $COMMAND_ID"

    - echo "Waiting for deployment..."

    - |
      while true; do
        STATUS=$(aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "i-0fb696d4212f059e7" \
          --region "$AWS_DEFAULT_REGION" \
          --query 'Status' \
          --output text)

        echo "SSM status: $STATUS"

        case "$STATUS" in
          Pending|InProgress)
            sleep 3
            ;;

          Success)
            echo "=== MEXE DEPLOY OUTPUT ==="

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0fb696d4212f059e7" \
              --region "$AWS_DEFAULT_REGION" \
              --query 'StandardOutputContent' \
              --output text

            echo "=== MEXE DEPLOY SUCCESS ==="
            break
            ;;

          *)
            echo "=== MEXE DEPLOY FAILED ==="

            echo "--- STDOUT ---"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0fb696d4212f059e7" \
              --region "$AWS_DEFAULT_REGION" \
              --query 'StandardOutputContent' \
              --output text

            echo "--- STDERR ---"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0fb696d4212f059e7" \
              --region "$AWS_DEFAULT_REGION" \
              --query 'StandardErrorContent' \
              --output text

            exit 1
            ;;
        esac
      done

    - echo "MEXE deployment completed successfully"
