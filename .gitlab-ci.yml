stages:
  - test
  - build

backend-tests:
  stage: test
  image: python:3.14

  before_script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt

  script:
    - python -m pytest

frontend-build:
  stage: test
  image: node:22

  before_script:
    - cd frontend
    - npm ci

  script:
    - npm run build

docker-backend:
  stage: build
  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker info
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name mexe-builder

  script:
    - docker buildx build --platform linux/amd64,linux/arm64 --tag mexe-backend:test --push=false ./backend

docker-frontend:
  stage: build
  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker info
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name mexe-builder

  script:
    - docker buildx build --platform linux/amd64,linux/arm64 --tag mexe-frontend:test --push=false ./frontend
