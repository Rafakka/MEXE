stages:
  - test
  - build
  - publish
  - deploy

backend-tests:
  stage: test
  image: python:3.14

  before_script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt

  script:
    - python -m pytest

frontend-build:
  stage: test
  image: node:22

  before_script:
    - cd frontend
    - npm ci

  script:
    - npm run build

docker-backend:
  stage: build
  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker info
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name mexe-builder

  script:
    - docker buildx build --platform linux/amd64,linux/arm64 --tag mexe-backend:test --push=false ./backend

docker-frontend:
  stage: build
  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker info
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name mexe-builder

  script:
    - docker buildx build --platform linux/amd64,linux/arm64 --tag mexe-frontend:test --push=false ./frontend

publish-images:
  stage: publish
  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker info
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name mexe-builder
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

  script:
    - docker buildx build --platform linux/amd64,linux/arm64 --tag ghcr.io/rafakka/mexe-backend:$CI_COMMIT_SHA --push ./backend
    - docker buildx build --platform linux/amd64,linux/arm64 --tag ghcr.io/rafakka/mexe-frontend:$CI_COMMIT_SHA --push ./frontend

ssm-test:
  stage: deploy

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com

  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]

  script:
    - echo "Testing GitLab → AWS OIDC → SSM"

    - >
      CREDS=$(aws sts assume-role-with-web-identity
      --role-arn "arn:aws:iam::719514706307:role/MEXE-SSM-Deploy"
      --role-session-name "gitlab-mexe-test"
      --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 900
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text)

    - export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | awk '{print $1}')
    - export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | awk '{print $2}')
    - export AWS_SESSION_TOKEN=$(echo "$CREDS" | awk '{print $3}')

    - aws sts get-caller-identity

    - >
      aws ssm send-command
      --instance-ids "i-0fb696d4212f059e7"
      --document-name "AWS-RunShellScript"
      --parameters 'commands=["echo MEXE-GITLAB-SSM-OK","hostname"]'
      --region "$AWS_DEFAULT_REGION"
