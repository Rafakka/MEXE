workflow:
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[CI\/CD UP\]/i'
      when: always
    - when: never

stages:
  - test
  - build
  - security
  - publish

compose-smoke-test:
  stage: test
  image: docker:27

  services:
    - name: docker:27-dind
      command: ["--tls=false"]

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - apk add --no-cache curl
    - docker info

  script:
    - docker compose up -d --build
    - docker compose ps
    - docker compose ps --status running
    - docker compose ps --format "table {{.Name}}\t{{.State}}\t{{.Health}}"
    - chmod +x scripts/smoke-test.sh
    - ./scripts/smoke-test.sh

  after_script:
    - docker compose logs --no-color
    - docker compose down -v

backend-tests:
  stage: test
  image: python:3.14

  before_script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install -r requirements-dev.txt

  script:
    - python -m pytest

frontend-build:
  stage: test
  image: node:22

  before_script:
    - cd frontend
    - npm ci

  script:
    - npm run build

docker-backend:
  stage: build
  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  artifacts:
    when: always
    paths:
      - security/results/current/backend.json

  before_script:
    - docker info
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name mexe-builder

  script:
    - docker buildx build --platform linux/amd64 --tag mexe-backend:security-test --load ./backend

    - mkdir -p security/results/current

    - >
      docker run --rm
      -v /var/run/docker.sock:/var/run/docker.sock
      -v "$CI_PROJECT_DIR/security/results/current:/results"
      aquasec/trivy:latest
      image
      --format json
      --output /results/backend.json
      mexe-backend:security-test

    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL --exit-code 1 mexe-backend:security-test

    - docker buildx build --platform linux/amd64,linux/arm64 --tag mexe-backend:test --push=false ./backend

docker-frontend:
  stage: build
  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  artifacts:
    when: always
    paths:
      - security/results/current/frontend.json

  before_script:
    - docker info
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name mexe-builder

  script:
    - docker buildx build --platform linux/amd64 --tag mexe-frontend:security-test --load ./frontend

    - mkdir -p security/results/current

    - >
      docker run --rm
      -v /var/run/docker.sock:/var/run/docker.sock
      -v "$CI_PROJECT_DIR/security/results/current:/results"
      aquasec/trivy:latest
      image
      --format json
      --output /results/frontend.json
      mexe-frontend:security-test

    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL --exit-code 1 mexe-frontend:security-test

    - docker buildx build --platform linux/amd64,linux/arm64 --tag mexe-frontend:test --push=false ./frontend

security-scan:
  stage: security
  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  artifacts:
    when: always
    paths:
      - security/results/current/alloy.json
      - security/results/current/grafana.json
      - security/results/current/loki.json
      - security/results/current/prometheus.json

  before_script:
    - docker info

  script:
    - mkdir -p security/results/current

    - docker pull grafana/alloy:v1.19.1

    - >
      docker run --rm
      -v /var/run/docker.sock:/var/run/docker.sock
      -v "$CI_PROJECT_DIR/security/results/current:/results"
      aquasec/trivy:latest
      image
      --format json
      --output /results/alloy.json
      grafana/alloy:v1.19.1

    - docker pull grafana/grafana:13.2.0

    - >
      docker run --rm
      -v /var/run/docker.sock:/var/run/docker.sock
      -v "$CI_PROJECT_DIR/security/results/current:/results"
      aquasec/trivy:latest
      image
      --format json
      --output /results/grafana.json
      grafana/grafana:13.2.0

    - docker pull grafana/loki:3.7.7

    - >
      docker run --rm
      -v /var/run/docker.sock:/var/run/docker.sock
      -v "$CI_PROJECT_DIR/security/results/current:/results"
      aquasec/trivy:latest
      image
      --format json
      --output /results/loki.json
      grafana/loki:3.7.7

    - docker pull prom/prometheus:v3.14.0

    - >
      docker run --rm
      -v /var/run/docker.sock:/var/run/docker.sock
      -v "$CI_PROJECT_DIR/security/results/current:/results"
      aquasec/trivy:latest
      image
      --format json
      --output /results/prometheus.json
      prom/prometheus:v3.14.0

    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$CI_PROJECT_DIR/.trivyignore:/root/.trivyignore:ro" aquasec/trivy:latest image --severity CRITICAL --exit-code 1 --ignorefile /root/.trivyignore grafana/alloy:v1.19.1

    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$CI_PROJECT_DIR/.trivyignore:/root/.trivyignore:ro" aquasec/trivy:latest image --severity CRITICAL --exit-code 1 --ignorefile /root/.trivyignore grafana/grafana:13.2.0

    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$CI_PROJECT_DIR/.trivyignore:/root/.trivyignore:ro" aquasec/trivy:latest image --severity CRITICAL --exit-code 1 --ignorefile /root/.trivyignore grafana/loki:3.7.7

    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$CI_PROJECT_DIR/.trivyignore:/root/.trivyignore:ro" aquasec/trivy:latest image --severity CRITICAL --exit-code 1 --ignorefile /root/.trivyignore prom/prometheus:v3.14.0

publish-images:
  stage: publish

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker info
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name mexe-builder
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

  script:
    - docker buildx build --platform linux/amd64,linux/arm64 --tag ghcr.io/rafakka/mexe-backend:$CI_COMMIT_SHA --tag ghcr.io/rafakka/mexe-backend:latest --push ./backend
    - docker buildx build --platform linux/amd64,linux/arm64 --tag ghcr.io/rafakka/mexe-frontend:$CI_COMMIT_SHA --tag ghcr.io/rafakka/mexe-frontend:latest --push ./frontend

security-results:
  stage: publish

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

  needs:
    - job: docker-backend
      artifacts: true
    - job: docker-frontend
      artifacts: true
    - job: security-scan
      artifacts: true

  image: alpine:3.22

  before_script:
    - apk add --no-cache git
    - git config user.name "GitLab CI"
    - git config user.email "gitlab-ci@$CI_SERVER_HOST"

  script: |
    mkdir -p security/results/current

    cat > security/results/current/metadata.json <<EOF
    {
      "schema_version": 1,
      "source_commit": "$CI_COMMIT_SHA",
      "pipeline_id": "$CI_PIPELINE_ID",
      "generated_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
      "images": {
        "backend": {
          "reference": "ghcr.io/rafakka/mexe-backend:$CI_COMMIT_SHA"
        },
        "frontend": {
          "reference": "ghcr.io/rafakka/mexe-frontend:$CI_COMMIT_SHA"
        }
      }
    }
    EOF

    git add security/results/current

    if git diff --cached --quiet; then
      echo "Nenhuma alteração nos security results."
      exit 0
    fi

    git commit -m "[skip ci] update security results for $CI_COMMIT_SHA"

    git config http.extraHeader "JOB-TOKEN: $CI_JOB_TOKEN"

    git push origin "HEAD:$CI_DEFAULT_BRANCH"
