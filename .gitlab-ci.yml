workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

stages:
  - test
  - build
  - security
  - publish

integration-test:
  stage: test

  image: docker:27

  services:
    - name: docker:27-dind
      command: ["--tls=false"]

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - apk add --no-cache curl
    - docker info

  script:
    - docker compose up -d --build
    - docker compose ps
    - docker compose ps --status running
    - docker compose ps --format "table {{.Name}}\t{{.State}}\t{{.Health}}"
    - docker compose logs --no-color
    - chmod +x scripts/smoke-test.sh
    - ./scripts/smoke-test.sh

  after_script:
    - docker compose logs --no-color
    - docker compose down -v

backend-tests:
  stage: test
  image: python:3.14

  before_script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install -r requirements-dev.txt

  script:
    - python -m pytest

frontend-build:
  stage: test
  image: node:22

  before_script:
    - cd frontend
    - npm ci

  script:
    - npm run build

docker-backend:
  stage: build
  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker info
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name mexe-builder

  script:
    - docker buildx build --platform linux/amd64 --tag mexe-backend:security-test --load ./backend
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL --exit-code 1 mexe-backend:security-test
    - docker buildx build --platform linux/amd64,linux/arm64 --tag mexe-backend:test --push=false ./backend

docker-frontend:
  stage: build
  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker info
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name mexe-builder

  script:
    - docker buildx build --platform linux/amd64 --tag mexe-frontend:security-test --load ./frontend
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL --exit-code 1 mexe-frontend:security-test
    - docker buildx build --platform linux/amd64,linux/arm64 --tag mexe-frontend:test --push=false ./frontend

security-scan:
  stage: security
  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker info

  script:
    - docker pull grafana/alloy:v1.19.1
    - docker pull grafana/grafana:13.2.0
    - docker pull grafana/loki:3.7.7
    - docker pull prom/prometheus:v3.14.0

    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$CI_PROJECT_DIR/.trivyignore:/root/.trivyignore:ro" aquasec/trivy:latest image --severity CRITICAL --exit-code 1 --ignorefile /root/.trivyignore grafana/alloy:v1.19.1

    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$CI_PROJECT_DIR/.trivyignore:/root/.trivyignore:ro" aquasec/trivy:latest image --severity CRITICAL --exit-code 1 --ignorefile /root/.trivyignore grafana/grafana:13.2.0

    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$CI_PROJECT_DIR/.trivyignore:/root/.trivyignore:ro" aquasec/trivy:latest image --severity CRITICAL --exit-code 1 --ignorefile /root/.trivyignore grafana/loki:3.7.7

    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$CI_PROJECT_DIR/.trivyignore:/root/.trivyignore:ro" aquasec/trivy:latest image --severity CRITICAL --exit-code 1 --ignorefile /root/.trivyignore prom/prometheus:v3.14.0

publish-images:
  stage: publish

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker info
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name mexe-builder
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

  script:
    - docker buildx build --platform linux/amd64,linux/arm64 --tag ghcr.io/rafakka/mexe-backend:$CI_COMMIT_SHA --push ./backend
    - docker buildx build --platform linux/amd64,linux/arm64 --tag ghcr.io/rafakka/mexe-frontend:$CI_COMMIT_SHA --push ./frontend

